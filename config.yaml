# =============================================================================
# ACVRP-CO2 experiment configuration -- Macau Peninsula (default)
# =============================================================================
#
# Macau Peninsula combines a dense Portuguese-colonial street grid with
# extensive one-way regulation and steep gradients. We expect a higher
# AR asymmetry index here than in suburban or planned grid networks,
# making it a strong primary case study for measuring the
# asymmetry penalty in last-mile delivery routing.

region:
  # Centred on Tap Seac Square. A 2 km radius covers from the Border
  # Gate (north) down to Macau Tower (south), Inner Harbour (west) to
  # the Outer Harbour / NAPE area (east).
  centre_lat: 22.1980
  centre_lon: 113.5430
  radius_m: 2000
  network_type: drive

data:
  customers_csv: data/customers_macau.csv
  depot_index: 0

fleet:
  num_vehicles: 4
  vehicle_capacity: 60       # Total fleet capacity 240, demand sum ~122 (51%)

emissions:
  C1_distance: 0.000125
  C2_time:     0.00040
  C3_mass:     0.0000018
  empty_mass_kg: 2200
  co2_per_litre: 2.68
  avg_speed_kmh: 22          # Macau peninsula traffic is dense and slow

objective:
  alpha_distance: 0.5
  alpha_emissions: 0.5

ortools:
  time_limit_seconds: 90
  first_solution_strategy: PATH_CHEAPEST_ARC
  local_search_metaheuristic: GUIDED_LOCAL_SEARCH

genetic_algorithm:
  population_size: 120
  generations: 300
  crossover_prob: 0.85
  mutation_prob: 0.15
  tournament_size: 4
  random_seed: 42

output:
  results_dir: results_macau
  variants: [SE, SM, SR, AR]
