# =============================================================================
# NCO training configuration -- conservative N=20 setup
# =============================================================================
#
# This is the production training config. It is deliberately tuned to be
# reliable, fast, and reproducible on a single consumer GPU:
#
#   - N=20 customers: the problem size used by the seminal AM (Kool 2019)
#     and POMO (Kwon 2020) papers; well-validated and converges quickly.
#   - 50 epochs x 500 steps = 25,000 batches: from prior experiments,
#     val cost converges by around epoch 30, with 50 giving a safe margin.
#
# Expected wall-clock per policy on an RTX 5070 / 4070 / 3080:
#   - MatNet-CVRP:  60-90 minutes
#   - Vanilla-AM:    60-80 minutes
# Total for the overnight pipeline (both policies + classical + grid):
#   - 3-4 hours end-to-end.

seed: 42

# Emissions model parameters (must match the per-city config.yaml so the
# RL reward signal is consistent with classical solver evaluations).
emissions:
  C1_distance: 0.000125
  C2_time:     0.00040
  C3_mass:     0.0000018
  empty_mass_kg: 2200
  co2_per_litre: 2.68
  avg_speed_kmh: 25       # Reasonable urban average for Macau / HK

# Distribution from which on-the-fly synthetic ACVRP instances are
# drawn during training. The asymmetry factor controls how much the
# random "one-way" perturbation distorts the symmetric base.
synthetic:
  num_customers: 20
  capacity: 30
  demand_low: 1
  demand_high: 9
  asymmetry_factor_max: 1.4
  depot_at_centre: true

# Model architecture. embed_dim 128 / 3 layers / 8 heads:
#   - MatNet-CVRP (with bidirectional edge attention) ~ 350K params
#   - Vanilla-AM (coord-only)                         ~ 150K params
# Both fit comfortably in <2 GB VRAM during training.
model:
  node_feature_dim: 3        # (x_norm, y_norm, demand_norm)
  edge_feature_dim: 4        # (distance, time, fuel, CO2) all normalised
  embed_dim: 128
  n_heads: 8
  n_layers: 3
  ffn_dim: 256
  tanh_clip: 10.0
  cost_mode: distance        # "distance" | "co2" | "blend"
  co2_weight: 0.5
  co2_scale: 1000.0          # multiplies kg CO2 in blended cost

# Training schedule.
training:
  batch_size: 64
  n_starts: 8                # POMO multi-start baseline width during training
  eval_n_starts: 16          # ↑ wider POMO at eval for tighter val cost
  epochs: 50
  steps_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 2.0
  eval_every: 1
  early_stopping_patience: 15  # stop if val hasn't improved for 15 epochs
  checkpoint_dir: models
  device: cuda

# OSM-derived held-out evaluation set used DURING training.
# Pass --osm-eval to enable. Helps track real-world transfer.
osm_eval:
  # Macau Peninsula -- matches the primary case-study city.
  centre_lat: 22.1980
  centre_lon: 113.5430
  radius_m: 2000
  network_type: drive
  num_customers: 20
  capacity: 30
  num_instances: 16
  city_name: macau
