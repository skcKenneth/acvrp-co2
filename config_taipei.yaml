# =============================================================================
# ACVRP-CO2 experiment configuration -- Taipei downtown variant
# =============================================================================
#
# Compared with the Banqiao default config, this targets the dense
# core of Taipei (around Taipei Main Station), which has substantially
# more one-way streets and tighter blocks. We therefore expect a
# larger AR asymmetry index and a larger asymmetry penalty in the
# headline result.

region:
  # Around Taipei Main Station
  centre_lat: 25.0478
  centre_lon: 121.5170
  radius_m: 2500
  network_type: drive

data:
  customers_csv: data/customers_taipei.csv
  depot_index: 0

fleet:
  num_vehicles: 3
  vehicle_capacity: 50

emissions:
  C1_distance: 0.000125
  C2_time:     0.00040
  C3_mass:     0.0000018
  empty_mass_kg: 2200
  co2_per_litre: 2.68
  avg_speed_kmh: 25       # ↓ from 30; downtown is slower

objective:
  alpha_distance: 0.5
  alpha_emissions: 0.5

ortools:
  time_limit_seconds: 60
  first_solution_strategy: PATH_CHEAPEST_ARC
  local_search_metaheuristic: GUIDED_LOCAL_SEARCH

genetic_algorithm:
  population_size: 120
  generations: 300
  crossover_prob: 0.85
  mutation_prob: 0.15
  tournament_size: 4
  random_seed: 42

output:
  results_dir: results_taipei
  variants: [SE, SM, SR, AR]
