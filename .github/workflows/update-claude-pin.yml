# After each push to main (except pin-only commits), refresh docs/CLAUDE_PIN.md
# so Claude can read one stable URL for the latest pinned SHA + raw source links.
name: Update CLAUDE_PIN

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/CLAUDE_PIN.md

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate CLAUDE_PIN for pushed commit
        run: python scripts/update_claude_pin.py --sha "${{ github.sha }}"

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/CLAUDE_PIN.md; then
            echo "CLAUDE_PIN.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLAUDE_PIN.md
          git commit -m "chore: update CLAUDE_PIN for Claude [skip ci]"
          git push
